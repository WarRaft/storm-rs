[package]
name = "storm-rs"
version = "0.1.0"
edition = "2024"
authors = ["phphacker <phphackerr@gmail.com>"]
description = "A pure Rust implementation of StormLib for reading MPQ archives."
repository = "https://github.com/phphackerr/storm-rs"
license = "MIT"
keywords = ["mpq", "blizzard", "archive", "parser", "writer"]
categories = ["compression", "encoding", "filesystem"]

[dependencies]
byteorder = "1.5.0"
bzip2 = "0.6.1"
crc32fast = "1.5.5"
flate2 = "1.1.11"
log = "0.4.35"
lzma-rust2 = { version = "0.25.0", features = ["encoder"] }
md-5 = "0.11.0"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha1 = "0.11.0"

[dev-dependencies]
serde_json = "1.0.154"
